<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f7">
  <title>管理 DeepSeek Harness</title>
  <link rel="icon" href="../gateway/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../gateway/theme.css">
  <style>
    body { display: grid; place-items: center; padding: 36px 20px; }
    main { width: min(404px, 100%); display: grid; gap: 20px; justify-items: center; }
    .hero { display: grid; gap: 12px; justify-items: center; text-align: center; }
    .hero-logo img { width: 52px; height: 52px; }
    .hero-title { font-size: 19px; font-weight: 600; letter-spacing: 0.01em; color: var(--text); }
    .hero-sub {
      font-size: 10.5px;
      color: var(--muted);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-top: -8px;
    }
    .login-card { width: 100%; padding: 26px 26px 22px; }
    .login-card h1 { margin: 0; font-size: 19px; font-weight: 620; letter-spacing: -0.01em; }
    .login-card .lead { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.6; }
    .login-card form { margin-top: 18px; display: grid; gap: 10px; }
    .password-input {
      text-align: left;
      font: 500 16px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", sans-serif;
      letter-spacing: 0;
      text-indent: 0;
      padding: 0 14px;
    }
    .btn-block { width: 100%; }
    @media (max-width: 480px) {
      body { padding: 24px 16px; }
      .login-card { padding: 22px 18px 18px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <div class="hero-logo"><img src="../gateway/favicon.svg" alt="DeepSeek 鲸鱼徽标"></div>
      <div>
        <div class="hero-title">DeepSeek Harness</div>
        <div class="hero-sub">管理入口</div>
      </div>
    </div>

    <section class="card login-card" aria-labelledby="admin-title">
      <header>
        <h1 id="admin-title">验证管理密码</h1>
        <p class="lead">验证后可以查看配对码、吊销设备和检查网关状态。</p>
      </header>
      <form id="admin-form" novalidate>
        <label class="field-label" for="password">管理密码</label>
        <input class="text-input password-input" id="password" name="password" type="password" autocomplete="current-password" autofocus>
        <div class="form-error" id="error" role="alert" aria-live="polite"></div>
        <button class="btn btn-primary btn-block" id="submit" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span class="btn-label">进入管理</span>
        </button>
      </form>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const next = params.get("next") || "./admin";
    const form = document.getElementById("admin-form");
    const input = document.getElementById("password");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit");
    const submitLabel = submitBtn.querySelector(".btn-label");

    const errorIcon =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>';

    function showError(message) {
      errorEl.innerHTML = `${errorIcon}<span>${message}</span>`;
      input.focus();
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      submitLabel.textContent = loading ? "验证中…" : "进入管理";
      if (loading) {
        const spinner = document.createElement("span");
        spinner.className = "spinner";
        submitBtn.insertBefore(spinner, submitLabel);
      } else {
        submitBtn.querySelector(".spinner")?.remove();
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = input.value;
      if (!password) {
        showError("请输入管理密码");
        return;
      }
      errorEl.textContent = "";
      setLoading(true);
      try {
        const response = await fetch("./admin-login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ password })
        });
        if (response.ok) {
          location.href = next;
          return;
        }
        const body = await response.json().catch(() => ({}));
        showError(body.message || "管理密码不正确。");
      } catch {
        showError("网络错误，请检查连接后重试。");
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
